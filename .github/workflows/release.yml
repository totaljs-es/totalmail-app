name: Release

# A version tag (v1.0.0, the version of package.json) builds the app for Windows, Linux and Android and publishes them in
# a GitHub release with their SHA-256. Nothing is built on a personal machine: the release is the build of this tag.
#
# Android needs the key that signs the APK, in the secrets of the repository:
#   ANDROID_KEYSTORE           the keystore (PKCS12 or JKS), in base64 (base64 -i totalmail-android.p12)
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          the alias of the key
# Keep the keystore: an update of the app must be signed with the same key, or Android refuses to install it over the old one.
# Windows is not signed yet (see README.md, Code signing).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: The tag is the version of package.json
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::The tag $GITHUB_REF_NAME is not v$version (package.json)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the libraries of the web view
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --bundles nsis,msi
      - name: Name the installers after the version
        shell: bash
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/nsis/*.exe "out/TotalMail-${{ needs.check.outputs.version }}-windows-x64-setup.exe"
          cp src-tauri/target/release/bundle/msi/*.msi "out/TotalMail-${{ needs.check.outputs.version }}-windows-x64.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  linux:
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install the libraries of the web view
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npx tauri build --bundles deb,rpm,appimage
      - name: Name the packages after the version
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/deb/*.deb "out/TotalMail-${{ needs.check.outputs.version }}-linux-amd64.deb"
          cp src-tauri/target/release/bundle/rpm/*.rpm "out/TotalMail-${{ needs.check.outputs.version }}-linux-x86_64.rpm"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "out/TotalMail-${{ needs.check.outputs.version }}-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  android:
    needs: check
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
      BUILD_TOOLS: 35.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The default list asks for "tools", a package the Android repository no longer has
          packages: platform-tools
      - name: Install the NDK and the build tools
        run: |
          sdkmanager "ndk;$NDK_VERSION" "build-tools;$BUILD_TOOLS" "platforms;android-35"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Create the Android project, with the icons of the app
        run: |
          npx tauri android init --ci
          cp -r src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/
      - run: npx tauri android build --apk --ci
      - name: Sign the APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE" || { echo "::error::ANDROID_KEYSTORE is not in the secrets of the repository (see the top of this file)"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/totalmail.keystore"
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          unsigned=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*-unsigned.apk)
          mkdir out
          "$tools/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/totalmail.keystore" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
            --out "out/TotalMail-${{ needs.check.outputs.version }}-android.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --print-certs "out/TotalMail-${{ needs.check.outputs.version }}-android.apk" | grep -i "SHA-256"
          rm -f "$RUNNER_TEMP/totalmail.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  release:
    needs: [check, windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: SHA-256 of every file
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Notes of the release
        run: |
          {
            echo "TotalMail ${{ needs.check.outputs.version }} for Windows, Linux and Android. It needs a TotalMail server: on first launch it asks for its address."
            echo
            echo "**Windows:** the installer is not signed yet. The first time, Windows SmartScreen says it protected your PC: choose **More info → Run anyway**."
            echo "**Android:** open the APK on the phone and allow installing apps from this source when Android asks."
            echo
            echo "SHA-256 of each file:"
            echo '```'
            cat out/SHA256SUMS.txt
            echo '```'
          } > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "TotalMail ${{ needs.check.outputs.version }}" --notes-file notes.md --verify-tag
