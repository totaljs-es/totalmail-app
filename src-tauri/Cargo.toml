[package]
name = "totalmail-app"
version = "1.0.0"
description = "TotalMail: the webmail of your TotalMail server in an app of its own"
authors = ["Spanish Total.js Platform"]
license = "MIT"
repository = "https://github.com/totaljs-es/totalmail-app"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "totalmail_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2.8.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
